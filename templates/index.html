<html>

<head>
    <meta charset="utf-8">
    <title>Selection PVA</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <!doctype html>
</head>

<body>
    <div id="panneau">
        Annee min <input id="annee_min" type="number" value="1970" style="width:70px">
        Annee max <input id="annee_max" type="number" value="2020" style="width:70px">
        <button onclick="rechercher()">Recherche</button>
        <button onclick="exporter()">Exporter en txt</button>
        <span id="resultat"></span>
    </div>
    <div id="carte"></div>
    <script>
        var carte = L.map('carte').setView([46.6, 2.5], 6);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(carte);
        var marqueurs = L.layerGroup().addTo(carte);

        function parametres() {
            var b = carte.getBounds();
            return "xmin=" + b.getWest() + "&xmax=" + b.getEast()
                + "&ymin=" + b.getSouth() + "&ymax=" + b.getNorth()
                + "&annee_min=" + document.getElementById("annee_min").value
                + "&annee_max=" + document.getElementById("annee_max").value;
        }

        function rechercher() {
            fetch("/recherche?" + parametres())
                .then(r => r.json())
                .then(function (data) {
                    marqueurs.clearLayers();
                    data.points.forEach(function (p) {
                        L.circleMarker([p.lat, p.lon], { radius: 3 })
                            .bindTooltip(p.url, { interactive: true })
                            .bindPopup(p.url)
                            .addTo(marqueurs);
                    });
                    document.getElementById("resultat").innerText =
                        data.total + " cliches trouves (" + data.points.length + " affiches)";
                });
        }

        function exporter() {
            window.location = "/export?" + parametres();
        }
    </script>
</body>

</html>
